[project]
name = "osgop-parser"
version = "0.1.0"
description = "FastAPI service for extracting structured data from OSGOP PDF documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "environs>=14.5.0",
    "fastapi[standard]>=0.123.0",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pdfminer.six>=20231228",
    "pymupdf>=1.26.6",
    "pypdf>=6.4.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "httpx>=0.28.1",
]
